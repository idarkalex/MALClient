name: Build Android APK

on:
  push:
    branches: [mal-alternative-api]
    tags: ['v*']
  pull_request:
    branches: [mal-alternative-api]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xamarin Android workload
        shell: pwsh
        run: |
          $vswhere = "C:\ProgramData\Chocolatey\bin\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS Path: $vsPath"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $proc = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @("modify", "--installPath", $vsPath, "--add", "Microsoft.VisualStudio.Workload.Xamarin", "--quiet", "--norestart", "--wait")
          Write-Host "Exit code: $($proc.ExitCode)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check environment
        shell: pwsh
        run: |
          $vswhere = "C:\ProgramData\Chocolatey\bin\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS Path: $vsPath"

          # Check Xamarin targets
          $targets = "$vsPath\MSBuild\Xamarin\Android\Xamarin.Android.CSharp.targets"
          $targets2 = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Xamarin\Android\Xamarin.Android.CSharp.targets"
          $targets3 = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Xamarin\Android\Xamarin.Android.CSharp.targets"
          Write-Host "Checking target files..."
          foreach ($t in @($targets, $targets2, $targets3)) {
            if (Test-Path $t) { Write-Host "FOUND: $t" } else { Write-Host "NOT FOUND: $t" }
          }

          # Also check via MSBuildExtensionsPath
          msbuild /version
          $extPath = & msbuild /version /nologo 2>$null | Select-String "MSBuildExtensionsPath" -SimpleMatch
          Write-Host "MSBuild version info:"
          msbuild /version /nologo

      - name: Restore NuGet packages
        run: nuget restore MALClient.sln

      - name: Build Android APK (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          msbuild MALClient.Android\MALClient.Android.csproj /t:Rebuild /p:Configuration=AndroidRelease /p:Platform="Any CPU" /p:AndroidUseSharedRuntime=False /p:EmbedAssembliesIntoApk=True /p:AndroidSupportedAbis="armeabi-v7a;x86;x86_64;arm64-v8a" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Sign APK (if keystore secrets provided)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: pwsh
        run: |
          $keystorePath = "$env:RUNNER_TEMP\keystore.jks"
          [System.IO.File]::WriteAllBytes($keystorePath, [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          $apks = Get-ChildItem -Path "MALClient.Android\bin\AndroidRelease" -Filter "*.apk" -Recurse
          foreach ($apk in $apks) {
            & $apksigner sign --ks $keystorePath --ks-pass "pass:$env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass "pass:$env:ANDROID_KEY_PASSWORD" $apk.FullName
            Write-Host "Signed: $($apk.Name)"
          }
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MALClient-Android-Release
          path: MALClient.Android\bin\AndroidRelease\*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MALClient-Android-Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
          generate_release_notes: true
