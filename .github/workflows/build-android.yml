name: Build Android APK

on:
  push:
    branches: [mal-alternative-api]
    tags: ['v*']
  pull_request:
    branches: [mal-alternative-api]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xamarin Android SDK
        shell: pwsh
        run: |
          $vswhere = "C:\ProgramData\Chocolatey\bin\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS Path: $vsPath"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Workload.NetCrossPlat --add Component.Xamarin --quiet --norestart --wait
          $exitCode = $LASTEXITCODE
          Write-Host "Exit code: $exitCode"
          if ($exitCode -ne 0) { throw "Installer failed with exit code $exitCode" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore MALClient.sln

      - name: Debug build environment
        shell: pwsh
        run: |
          $vswhere = "C:\ProgramData\Chocolatey\bin\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS Path: $vsPath"
          Write-Host "=== MSBuild ==="
          Get-Command msbuild.exe | Select-Object Source, FileVersionInfo
          Write-Host "=== Xamarin targets (64-bit) ==="
          $p64 = "$vsPath\MSBuild\Xamarin\Android"
          if (Test-Path $p64) { Get-ChildItem $p64 -Filter "*.targets" | Select-Object Name }
          else { Write-Host "NOT found at $p64" }
          $p86 = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Xamarin\Android"
          Write-Host "=== Xamarin targets (32-bit) ==="
          if (Test-Path $p86) { Get-ChildItem $p86 -Filter "*.targets" | Select-Object Name }
          else { Write-Host "NOT found at $p86" }
          Write-Host "=== Android SDK ==="
          if ($env:ANDROID_HOME) { Write-Host "ANDROID_HOME=$env:ANDROID_HOME" }
          else { Write-Host "ANDROID_HOME not set" }
          if (Test-Path "C:\Program Files (x86)\Android\android-sdk") { Write-Host "Android SDK at default path" }

      - name: Build Android APK (Release)
        shell: cmd
        run: |
          msbuild MALClient.Android\MALClient.Android.csproj /t:Rebuild /p:Configuration=AndroidRelease /p:Platform="Any CPU" /p:AndroidUseSharedRuntime=False /p:EmbedAssembliesIntoApk=True /p:AndroidSupportedAbis="armeabi-v7a;x86;x86_64;arm64-v8a" > "%RUNNER_TEMP%\msbuild-out.txt" 2>&1
          set ERR=%ERRORLEVEL%
          type "%RUNNER_TEMP%\msbuild-out.txt"
          if %ERR% neq 0 (
            findstr /n /c:"error CS" "%RUNNER_TEMP%\msbuild-out.txt"
            findstr /n /c:"error :" "%RUNNER_TEMP%\msbuild-out.txt"
            findstr /n /c:"error XA" "%RUNNER_TEMP%\msbuild-out.txt"
            exit /b 1
          )

      - name: Sign APK (if keystore secrets provided)
        if: success() && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: pwsh
        run: |
          $keystorePath = "$env:RUNNER_TEMP\keystore.jks"
          [System.IO.File]::WriteAllBytes($keystorePath, [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $apksigner = Join-Path $buildTools.FullName "apksigner.bat"
          $apks = Get-ChildItem -Path "MALClient.Android\bin\AndroidRelease" -Filter "*.apk" -Recurse
          foreach ($apk in $apks) {
            & $apksigner sign --ks $keystorePath --ks-pass "pass:$env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass "pass:$env:ANDROID_KEY_PASSWORD" $apk.FullName
            Write-Host "Signed: $($apk.Name)"
          }
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MALClient-Android-Release
          path: MALClient.Android\bin\AndroidRelease\*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MALClient-Android-Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
          generate_release_notes: true
